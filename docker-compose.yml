# ============================================================================
#  docker-compose - untuk UJI COBA LOKAL sebelum deploy ke Coolify.
#  Di Coolify cukup pakai Build Pack "Dockerfile" (compose ini tidak dipakai).
#
#  Jalankan:  docker compose up --build
#  Buka    :  http://localhost:8000
# ============================================================================
services:
  mariadb:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?isi MARIADB_ROOT_PASSWORD di file .env}
      MARIADB_DATABASE: ${DB_DATABASE:-default}
      MARIADB_USER: ${DB_USERNAME:-mariadb}
      MARIADB_PASSWORD: ${DB_PASSWORD:?isi DB_PASSWORD di file .env}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        REACT_APP_BACKEND_URL: ""
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-default}
      DB_USERNAME: ${DB_USERNAME:-mariadb}
      DB_PASSWORD: ${DB_PASSWORD:?isi DB_PASSWORD di file .env}
      APP_ENV: development
      PORT: 8000
      JWT_SECRET: ${JWT_SECRET:?isi JWT_SECRET di file .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@bappeda.makassarkota.go.id}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?isi ADMIN_PASSWORD di file .env}
      EMERGENT_LLM_KEY: ${EMERGENT_LLM_KEY:-}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      COOKIE_SECURE: "false"
      COOKIE_SAMESITE: lax
      # Isi dengan origin eksplisit bila frontend/backend beda origin; jangan "*".
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    volumes:
      # Ruang kerja Import Wizard (unggahan Excel/CSV) agar tidak hilang saat container diganti.
      - app_uploads:/srv/data_upload
    ports:
      - "8000:8000"

volumes:
  mariadb_data:
  app_uploads:
